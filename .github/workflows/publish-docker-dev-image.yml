name: Build and deploy docker DEV images

on:
  workflow_dispatch:
    inputs:
      push_to_registry:
        type: boolean
        default: false
        description: Publish to registry?
      products_to_push:
        description: Array of product names for which build will be done.
        type: string
        default: '["enrollment-server-onboarding-adapter-mock"]'
        required: true
  pull_request:
    branches:
      - 'develop'
      - 'master'
      - 'releases/*'
    paths:
      - 'enrollment-server-onboarding-adapter-mock/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  set-environment:
    runs-on: ubuntu-latest
    outputs:
      products_to_push: ${{ steps.set-products-list.outputs.products_to_push }}
      should_push: ${{ steps.set-cond.outputs.should_push }}
    steps:
      - name: Set products list
        id: set-products-list
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.products_to_push }}" ]; then
            echo 'products_to_push=${{ inputs.products_to_push }}' >> $GITHUB_OUTPUT
          else
            echo 'products_to_push=["enrollment-server-onboarding-adapter-mock"]' >> $GITHUB_OUTPUT
          fi
      - name: Set condition
        id: set-cond
        run: |
          if [[ "${{ inputs.push_to_registry }}" == "true" || 
                ("${{ github.ref }}" == "refs/heads/develop" && 
                 "${{ github.actor }}" != "dependabot[bot]" && 
                 "${{ github.event_name }}" == "push") ]]; then
            echo "should_push=true" >> $GITHUB_OUTPUT
          else
            echo "should_push=false" >> $GITHUB_OUTPUT
          fi

  build:
    runs-on: 'ubuntu-latest'
    needs: set-environment
    environment: docker-internal
    env:
      # these are global secrets - for readonly access to artifactory
      INTERNAL_USERNAME: ${{ secrets.JFROG_USERNAME }}
      INTERNAL_PASSWORD: ${{ secrets.JFROG_PASSWORD }}
    strategy:
      matrix:
        app: ${{ fromJSON(needs.set-environment.outputs.products_to_push)}}
    steps:
      - uses: actions/checkout@v5
      - name: Get ${{ matrix.app }} Server version
        run: |
          cd ${{ matrix.app }}
          TIMESTAMP=$(date +%Y.%m.%d)
          IMAGE_VERSION=${TIMESTAMP}-${{ github.sha }}
          IMAGE_NAME=${{ matrix.app }}:${IMAGE_VERSION}
          echo "IMAGE_VERSION=$IMAGE_VERSION" >> $GITHUB_ENV
          echo "IMAGE_NAME=$IMAGE_NAME" >> $GITHUB_ENV
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to ACR
        if: vars.ACR_REGISTRY_URL != '' && github.actor != 'dependabot[bot]'
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.ACR_REGISTRY_URL }}
          username: ${{ vars.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
      - name: Set dynamic tags for image
        run: |
          {
            echo "TAGS<<EOF" 
              echo "${{ vars.ACR_REGISTRY_URL != ''  && format('{0}/{1}', vars.ACR_REGISTRY_URL, env.IMAGE_NAME) || '' }}"
            echo "EOF"
          } >> $GITHUB_ENV

      - name: Build and push container image to registry
        uses: docker/build-push-action@v6
        with:
          push: ${{ needs.set-environment.outputs.should_push == 'true' }}
          platforms: linux/amd64,linux/arm64
          tags: ${{ env.TAGS }}
          file: ${{ matrix.app }}/docker/Dockerfile
          context: ./${{ matrix.app }}
