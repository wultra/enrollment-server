services:
  onboarding-adapter-mock:
    build:
      context: ..
      dockerfile: enrollment-server-onboarding-adapter-mock/docker/Dockerfile
    ports:
      - "8081:8080"
    environment:
      LIVENESS_CHECK_PROXY_BASE_URL: ${LIVENESS_CHECK_PROXY_BASE_URL:-}
      LIVENESS_CHECK_PROXY_USERNAME: ${LIVENESS_CHECK_PROXY_USERNAME:-}
      LIVENESS_CHECK_PROXY_PASSWORD: ${LIVENESS_CHECK_PROXY_PASSWORD:-}
